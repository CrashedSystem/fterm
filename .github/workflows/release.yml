name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build APK & ftermd + Attest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & Build-Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDK_ROOT/platforms/android-36/android.jar" ]; then
            yes | "$SDKMGR" "platforms;android-36" >/dev/null
          fi
          BT_DIR=$(ls -d "$SDK_ROOT/build-tools/"* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$BT_DIR" ]; then
            yes | "$SDKMGR" "build-tools;35.0.0" >/dev/null
            BT_DIR=$(ls -d "$SDK_ROOT/build-tools/"* 2>/dev/null | sort -V | tail -n1)
          fi
          echo "SDKJAR=$SDK_ROOT/platforms/android-36/android.jar" >> "$GITHUB_ENV"
          echo "$BT_DIR" >> "$GITHUB_PATH"

      - name: Prepare signing keystore (if configured)
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=${KEYSTORE_PASS:-openclaw}" >> "$GITHUB_ENV"
            echo "has_ks=true" >> "$GITHUB_OUTPUT"
          else
            echo "KS=$RUNNER_TEMP/ephemeral.jks" >> "$GITHUB_ENV"
            echo "has_ks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fterm.apk
        run: bash build.sh

      - name: Set up Rust (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build ftermd (aarch64-linux-android)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_DIR=$(ls -d "$SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -n1)
          if [ -z "$NDK_DIR" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
            NDK_DIR=$(ls -d "$SDK_ROOT/ndk/"* 2>/dev/null | sort -V | tail -n1)
          fi
          CC_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_BIN"
          export CC_aarch64_linux_android="$CC_BIN"
          cargo build --release --locked \
            --target aarch64-linux-android \
            --manifest-path termux/ftermd-rs/Cargo.toml

      - name: Package release artifacts & SHA256SUMS
        run: |
          mkdir -p dist
          cp build/fterm.apk dist/fterm.apk
          cp termux/ftermd-rs/target/aarch64-linux-android/release/ftermd dist/ftermd-aarch64-linux-android
          (cd dist && sha256sum fterm.apk ftermd-aarch64-linux-android > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          apksigner verify --print-certs dist/fterm.apk | tee dist/apk-cert-fingerprint.txt || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/fterm.apk
            dist/ftermd-aarch64-linux-android
            dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fterm-release
          path: dist/*

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="Automated release build from GitHub Actions (${GITHUB_SHA})."
          if [ "${{ steps.ks.outputs.has_ks }}" != "true" ]; then
            NOTES="$NOTES\n\n> ⚠️ Signed with an ephemeral CI keystore (add \`ANDROID_KEYSTORE_BASE64\` & \`ANDROID_KEYSTORE_PASS\` secrets for a persistent signing key)."
          fi
          gh release create "$TAG" \
            dist/fterm.apk \
            dist/ftermd-aarch64-linux-android \
            dist/SHA256SUMS.txt \
            --title "fterm $TAG" \
            --notes "$(printf '%b' "$NOTES")" \
            --verify-tag || \
          gh release upload "$TAG" \
            dist/fterm.apk \
            dist/ftermd-aarch64-linux-android \
            dist/SHA256SUMS.txt \
            --clobber

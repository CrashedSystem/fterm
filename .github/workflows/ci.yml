name: CI

# Everything here is runnable on a plain ubuntu-latest with nothing installed but rust and a
# JDK (the Java suites still drive the daemon over its socket from python3, which ubuntu has).
# The daemon is started on a free port with its own FTERM_RUNDIR, so the suites never touch
# a real ~/.fterm or a running phone daemon.
#
# What a Linux runner cannot check - install.sh, the Android PTY, termux-api's ART variables,
# the font picker, the keeper, doze - is listed in docs/ROADMAP.md under "기기에서만 확인되는 것".

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ftermd
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: termux/ftermd-rs
      - name: Build
        run: cargo build --release --locked --manifest-path termux/ftermd-rs/Cargo.toml
      - name: Unit tests (mode tracker, ring, framing, pidfile, backpressure, env)
        run: cargo test --locked --manifest-path termux/ftermd-rs/Cargo.toml
      - name: Protocol and mode tracker against the Rust binary
        run: bash tests/run_daemon.sh termux/ftermd-rs/target/release/ftermd

  java:
    name: Java core (ANSI parser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # run_core.sh keeps Termux's tmp path by default; FTERM_TMPDIR is the whole of what it
      # needs to run somewhere else.
      - name: ANSI parser, widths, palettes, mode restore
        env:
          FTERM_TMPDIR: ${{ runner.temp }}
        run: bash tests/run_core.sh

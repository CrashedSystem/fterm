# Build performance on a phone: the daemon is expensive and the build is small.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.jvmargs=-Xmx1536m

# Paths. Override on the command line or in ~/.gradle/gradle.properties:
#   ./gradlew assemble -PandroidJar=/path/to/android.jar
androidJar=
